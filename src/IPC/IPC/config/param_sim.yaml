goal_z_3:    1.0
use_waypoint_sequence: false

rc_reverse:
    roll: false
    pitch: false
    yaw: false
    throttle: false

auto_takeoff_land:
    enable: false
    enable_auto_arm: false
    no_RC: true
    takeoff_height: 1.0
    takeoff_land_speed: 0.3

rog_astar:
  map_voxel_num: [ 100, 100, 15 ]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false
  esdf_weight: 5.0
  safe_distance: 1.0
  floyd_safe_distance: 0.8

mpc:
  horizon:     15
  step:        0.1
  R_p:         2000.0
  R_v:         0.0
  R_a:         0.0
  R_u:         0.0
  R_u_con:     1.0
  R_pN:        2000.0
  R_vN:        200.0
  R_aN:        200.0
  D_x:         0.0
  D_y:         0.0
  D_z:         0.05
  vx_min:     -20.0
  vy_min:     -20.0
  vz_min:     -10.0
  vx_max:      20.0
  vy_max:      20.0
  vz_max:      10.0
  ax_min:     -10.0
  ay_min:     -10.0
  az_min:     -10.0
  ax_max:      10.0
  ay_max:      10.0
  az_max:      10.0
  ux_min:     -100.0
  uy_min:     -100.0
  uz_min:     -100.0
  ux_max:      100.0
  uy_max:      100.0
  uz_max:      100.0

rog_map:
  resolution: 0.2
  inflation_resolution: 0.2
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 20, 20, 6 ]
  fix_map_origin: [0 , 0 , 0.5]
  frontier_extraction_en: false
  virtual_ceil_height: 6
  virtual_ground_height: -0.2
  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.2
  esdf:
    enable: true
    resolution: 0.2
    local_update_box: [ 20,20,3 ]
  ros_callback:
    enable: true
    cloud_topic: "/pcl_render_node/cloud"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0
  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [ 100, 100,5 ]
    frame_id: "map"
    pub_unknown_map_en: false
  intensity_thresh: -10
  point_filt_num: 1
  raycasting:
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    ray_range: [0.0, 20 ]
    p_min: 0.12
    p_miss: 0.49
    p_free: 0.499
    p_occ:  0.85
    p_hit: 0.9
    p_max: 0.97
    unk_thresh: 1.0

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5
    goal: 0.5

#----------------- base param -----------------#
simulation:    true
perfect_simu:  false
odom_vel_in_body: false
mass:          2.6
gra:           9.81
ctrl_freq_max: 100.0
max_manual_vel: 4.0
low_voltage:   13.2

ctrl_delay:    0.0

thrust_limit:  0.9
hover_esti:    true
hover_perc:    0.41

visualization_en: true
corridor_bound_dis: 4.0
corridor_line_max_length: 5.0
visual_process: false
frontend_in_known_free: false
iris_iter_num: 2

#----------------- base param -----------------#
simulation:    false
perfect_simu:  false
odom_vel_in_body: true
mass:          1.6 # kg
gra:           9.81 
ctrl_freq_max: 100.0
max_manual_vel: 4.0
low_voltage:   13.2 # 4S battery

ctrl_delay:    0.0

thrust_limit:  0.9
hover_esti:    true
hover_perc:    0.26

visualization_en: true
corridor_bound_dis: 4.0
corridor_line_max_length: 5.0
visual_process: false
frontend_in_known_free: false
iris_iter_num: 2  #迭代次数越多，走廊越“宽松”，但计算量也增加
obs_skip_num: 2   #障碍物采样跳步数。生成安全走廊时，障碍物点云会进行下采样，跳过部分点以减少计算量。
robot_r: 0.3
ref_dis:     15  #ref_dis为MPC参考点间距间的点个数，表示ref_dis个点的距离作为MPC在horizon内的一个目标点，因此MPC间隔间距为ref_dis * path_dis
path_dis:    0.02  #路径稠密化的插值间距 2cm
planning_horizon: 15.0 #规划视野范围(米)，用于目标截断

yaw_ctrl_flag:  true
yaw_gain:       2.0
yaw_ki:         0.05
yaw_i_limit:    0.5
yaw_rate_limit: 5.0

## 45，0，0/ 50，0，0 / 43 -30 1
goal_x:      43.0
goal_y:      21.0
goal_z:      1.0

#航路点
goal_x_1:      43.0
goal_y_1:      21.0
goal_z_1:      1.0

goal_x_2:      50.0
goal_y_2:      -21.0
goal_z_2:      1.0

goal_x_3:      16.0
goal_y_3:      33.0
goal_z_3:      1.0
use_waypoint_sequence: false  # true: 点击一次切到下一个预设点; false: 直接飞向当前点击位置

rc_reverse: # *
    roll: false
    pitch: false
    yaw: false
    throttle: false

auto_takeoff_land:
    enable: true #set false when use qgc takeoff 
    enable_auto_arm: true
    no_RC: false # set true when sim, set false in exp
    takeoff_height: 1.5 # m
    takeoff_land_speed: 0.3 # m/s


rog_astar:
  #体素覆盖的范围会被裁剪到 map_size 范围内
  map_voxel_num: [ 100, 100, 15 ]  # 乘以resolution 0.2 得到实际体积大小
  visual_process: false
  allow_diag: true
  # 0 DIAG; 1 MANHATTAN; 2 EUCLIDEAN
  heu_type: 2
  debug_visualization_en: false
  esdf_weight: 3.0
  safe_distance: 1.0
  floyd_safe_distance: 0.8
  # path_dis:    0.02  #floyd路径稠密化的插值间距 2cm

mpc:
  horizon:     15 #总的预测步数，总的预测距离为 horizon * ref_dis * path_dis  要在box内
  step:        0.1
  # ctrl_delay:  0   # n step

  R_p:         2000.0
  R_v:         0.0
  R_a:         0.0
  R_u:         0.0  #控制量惩罚项权重，
  R_u_con:     1.0 #平滑度惩罚项，防止控制量跳变过大
  R_pN:        2000.0
  R_vN:        200.0
  R_aN:        200.0

  D_x:         0.0
  D_y:         0.0
  D_z:         0.05

  vx_min:     -20.0
  vy_min:     -20.0
  vz_min:     -10.0
  vx_max:      20.0
  vy_max:      20.0
  vz_max:      10.0

  ax_min:     -10.0
  ay_min:     -10.0
  az_min:     -10.0
  ax_max:      10.0
  ay_max:      10.0
  az_max:      10.0

  ux_min:     -150.0
  uy_min:     -150.0
  uz_min:     -150.0
  ux_max:      150.0
  uy_max:      150.0
  uz_max:      150.0


rog_map:
  resolution: 0.2
  inflation_resolution: 0.2
  inflation_step: 2      
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [ 40, 40, 6] #60 50 / 70 20 / 60 60 
  # If the map rolling is disable, the map origin [m] should be set.
  fix_map_origin: [15 , 0 ,  0.5 ] #A*搜索的高度最低为0.5m，但不会限制安全飞行走廊 25 50 /25,-25(开启了map_sliding则不用调整)
  frontier_extraction_en: false

  # Virtual ceil and ground 这些参数不直接限制 A 搜索*，但会在地图中创建虚拟障碍物，影响实际的路径规划。
  virtual_ceil_height: 6
  virtual_ground_height: -0.2

  load_pcd_en: false

  map_sliding:
    enable: false
    # The minimum distance [m] to slide the map.
    threshold: 0.2

  esdf:
    enable: true
    resolution: 0.2
    # The range of esdf around the odom [m].
    local_update_box: [ 20,20,3 ]

  # If [enable = true], the ROG-Map will actively take ros topic as input.
  #  else user should call function [updateMap] to update the map.
  ros_callback:
    enable: true
    # cloud_topic: "/cloud_registered"
    
    cloud_topic: "/cloud_registered"
    odom_topic: "/mavros/local_position/odom"
    odom_timeout: 2.0


  visualization:
    enable: true
    # when enabled, use rqt_reconfigure to change the visualization parameters.
    use_dynamic_reconfigure: false
    # The rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    time_rate: 2
    # The frame rate of visualization [Hz], if set to 0, the visualization will not be triggered by frame.
    frame_rate: 0
    # visualization range along the odom [m].
    range: [ 100, 100,5 ]
    frame_id: "map"
    pub_unknown_map_en: false

  # Intensity filter for input point cloud. If the point intensity is less than this value,
  # it will be ignored (to avoid noise like dusk).
  intensity_thresh: -10
  # The temporal downsample rate for input point cloud.
  #  e.g. if set to k, the point cloud will be downsampled to 1/k.
  point_filt_num: 1

  # Probabilistc update
  raycasting:
    # if disable, the map will only maintain occupied information, and all other grid
    # will be considered as unknown.
    enable: false
    batch_update_size: 1
    local_update_box: [ 100,100,5 ]
    # The range of raycasting [m].
    ray_range: [0.0, 20 ]

    p_min: 0.12
    p_miss: 0.49 #0.49
    p_free: 0.499 #0.499
    p_occ:  0.85 #0.85
    p_hit: 0.9 #0.9
    p_max: 0.97 #0.98
    # The threshold of a non-occupied inf map grid to be considered as free. [0.0-1.0]
    # for counter map, if each cell contains N cells in prob map, then only when
    # N_unk > N * unk_thresh cells are unknown, the cell will be considered as unknown.
    # example: 1) if unk_thresh is set 0.0, then once at least one cell in prob map is unknown,
    #             the cell will be considered as unknown.
    #         2) if unk_thresh is set to 1.0, then only all cells in prob map are unknown,
    #             the cell will be considered as unknown.
    # in all, 1.0 is more aggressive while 0.0 is more conservative.
    unk_thresh: 1.0


msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5
    goal: 0.5

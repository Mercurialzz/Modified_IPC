#----------------- MPC param -----------------#
simulation:    true
perfect_simu:  false
mass:          2.4 # kg
gra:           9.81 
ctrl_freq_max: 100.0
max_manual_vel: 4.0
low_voltage:   13.2 # 4S battery

ctrl_delay:    0.0
sfc_dis:       0.3

thrust_limit:  0.4
hover_esti:    false
hover_perc:    0.5

yaw_ctrl_flag: true
yaw_gain:      0.5

goal_x:        0.0
goal_y:        0.0
goal_z:        1.0

rc_reverse: # *
    roll: false
    pitch: false
    yaw: false
    throttle: true

auto_takeoff_land:
    enable: true #set false when use qgc takeoff 
    enable_auto_arm: true
    no_RC: true # set true when sim, set false in exp
    takeoff_height: 2.0 # m
    takeoff_land_speed: 0.3 # m/s

msg_timeout:
    odom: 0.5
    rc:   0.5
    cmd:  0.5
    imu:  0.5
    bat:  0.5
    goal: 0.5

astar:
  resolution:  0.1
  map_x_size:  20.0
  map_y_size:  20.0
  map_z_size:  3.0
  expand_dyn:  0.5
  expand_fix:  0.3

fsm:
  ref_dis:     6
  path_dis:    0.05

mpc:
  horizon:     15
  step:        0.1
  # ctrl_delay:  0   # n step

  R_p:         1000.0
  R_v:         0.0
  R_a:         0.0
  R_u:         0.0
  R_u_con:     0.2
  R_pN:        2000.0
  R_vN:        1000.0
  R_aN:        1000.0

  D_x:         0.0
  D_y:         0.0
  D_z:         0.0

  vx_min:     -10.0
  vy_min:     -10.0
  vz_min:     -10.0
  vx_max:      10.0
  vy_max:      10.0
  vz_max:      10.0

  ax_min:     -20.0
  ay_min:     -20.0
  az_min:     -10.0
  ax_max:      20.0
  ay_max:      20.0
  az_max:      20.0

  ux_min:     -50.0
  uy_min:     -50.0
  uz_min:     -50.0
  ux_max:      50.0
  uy_max:      50.0
  uz_max:      50.0

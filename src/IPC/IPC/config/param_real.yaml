#----------------- MPC param -----------------#
simulation:    false
perfect_simu:  false
frequency:     100.0
ctrl_delay:    0.0
sfc_dis:       0.3

thrust_limit:  0.8
hover_esti:    true
hover_perc:    0.3

yaw_ctrl_flag: true
yaw_gain:      0.6

goal_x:        0.0
goal_y:        0.0
goal_z:        0.5

# astar:
#   resolution:  0.2
#   map_x_size:  8.0
#   map_y_size:  8.0
#   map_z_size:  1.5
#   expand_dyn:  0.5
#   expand_fix:  0.3

fsm:
  ref_dis:     5
  path_dis:    0.05

planner:  # 走廊生成参数
  bound_dis:                0.5    # 边界框扩展距离（米）
  seed_line_max_dis:        2.0    # seed line 最大长度（米）
  min_overlap_threshold:    0.2    # 相邻走廊最小重叠深度（米）
  virtual_ground_height:    0.0    # 虚拟地面高度（米）
  virtual_ceil_height:      1.5    # 虚拟天花板高度（米）
  robot_r:                  0.2    # 机器人半径（米）
  box_search_skip_num:      0      # boxSearch 跳过采样数
  iris_iter_num:            2      # CIRI 椭球迭代次数

mpc:
  horizon:     15
  step:        0.1

  R_p:         1000.0
  R_v:         0.0
  R_a:         0.0
  R_u:         0.0
  R_u_con:     0.2
  R_pN:        2000.0
  R_vN:        200.0
  R_aN:        200.0

  D_x:         0.0
  D_y:         0.0
  D_z:         0.0

  vx_min:     -10.0
  vy_min:     -10.0
  vz_min:     -10.0
  vx_max:      10.0
  vy_max:      10.0
  vz_max:      10.0

  ax_min:     -20.0
  ay_min:     -20.0
  az_min:     -10.0
  ax_max:      20.0
  ay_max:      20.0
  az_max:      20.0

  ux_min:     -100.0
  uy_min:     -100.0
  uz_min:     -100.0
  ux_max:      100.0
  uy_max:      100.0
  uz_max:      100.0
